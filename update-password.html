<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>নতুন পাসওয়ার্ড সেট করুন | মানবসেবা ফাউন্ডেশন</title>

  <style>
    :root {
      --primary: #087a43;
      --primary-dark: #045a31;
      --bg: #eef7f1;
      --card: #ffffff;
      --text: #17251d;
      --muted: #66766c;
      --border: #d7e6dc;
      --error: #b32e2e;
      --success: #116d37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: "Noto Sans Bengali", "Hind Siliguri", Arial, sans-serif;
      background:
        linear-gradient(135deg, rgba(2, 67, 34, 0.9), rgba(8, 122, 67, 0.76)),
        url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1600&q=85")
        center/cover;
    }

    .card {
      width: min(460px, 100%);
      padding: 35px 30px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 22px 65px rgba(0, 0, 0, 0.28);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;
      border-radius: 50%;
      color: #fff;
      background: var(--primary);
      font-size: 1.5rem;
      font-weight: 800;
    }

    h1 {
      margin-bottom: 8px;
      text-align: center;
      font-size: 1.5rem;
    }

    .intro {
      margin-bottom: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.75;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8, 122, 67, 0.13);
    }

    .hint {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.77rem;
    }

    button {
      width: 100%;
      margin-top: 21px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      color: #fff;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    #message {
      display: none;
      margin-bottom: 15px;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    #message.success {
      display: block;
      color: var(--success);
      background: #e3f5e9;
    }

    #message.error {
      display: block;
      color: var(--error);
      background: #fff0f0;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: var(--primary);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">ম</div>

    <h1>নতুন পাসওয়ার্ড দিন</h1>

    <p class="intro">
      নিরাপদ একটি নতুন password দিন। Password পরিবর্তন হলে অফিসার লগইন পেজ থেকে আবার login করবেন।
    </p>

    <div id="message"></div>

    <form id="password-form">
      <label for="password">নতুন পাসওয়ার্ড</label>
      <input
        id="password"
        type="password"
        placeholder="কমপক্ষে ৬ অক্ষর"
        minlength="6"
        required
      />
      <p class="hint">কমপক্ষে ৬ অক্ষরের একটি শক্তিশালী password ব্যবহার করুন।</p>

      <label for="confirm-password">নতুন পাসওয়ার্ড আবার লিখুন</label>
      <input
        id="confirm-password"
        type="password"
        placeholder="একই password আবার লিখুন"
        minlength="6"
        required
      />

      <button id="save-button" type="submit">
        নতুন পাসওয়ার্ড সংরক্ষণ করুন
      </button>
    </form>

    <a class="back" href="login.html">← অফিসার লগইন পেজে ফিরে যান</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save-button");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function getSupabaseClient() {
      if (typeof supabaseClient !== "undefined") {
        return supabaseClient;
      }

      if (window.supabaseClient) {
        return window.supabaseClient;
      }

      return null;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const client = getSupabaseClient();

      if (!client) {
        showMessage(
          "Supabase সংযোগ পাওয়া যায়নি। supabase-config.js ফাইল পরীক্ষা করুন।",
          "error"
        );
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        showMessage("দুইটি password এক নয়। একই password লিখুন।", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Password কমপক্ষে ৬ অক্ষরের হতে হবে।", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "সংরক্ষণ হচ্ছে...";

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        showMessage(
          "Password পরিবর্তন করা যায়নি। Reset email-এর link থেকে এই পেজটি খুলেছেন কি না পরীক্ষা করুন।",
          "error"
        );
        saveButton.disabled = false;
        saveButton.textContent = "নতুন পাসওয়ার্ড সংরক্ষণ করুন";
        return;
      }

      showMessage(
        "Password সফলভাবে পরিবর্তন হয়েছে। এখন অফিসার লগইন পেজে গিয়ে নতুন password দিয়ে login করুন।",
        "success"
      );

      form.reset();
      saveButton.disabled = false;
      saveButton.textContent = "নতুন পাসওয়ার্ড সংরক্ষণ করুন";

      setTimeout(function () {
        window.location.href = "login.html";
      }, 3000);
    });
  </script>
</body>
</html>
